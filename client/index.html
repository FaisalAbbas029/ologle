<!doctype html>
<html lang="en" class="scroll-smooth" data-theme="default">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>OLOGLE — Real-Time Stranger Video, Audio & Text Chat</title>
  <meta name="description"
    content="Connect instantly with strangers worldwide across video, audio, and text chat. Completely anonymous, zero persistent logs, interest-based matchmaking." />
  <meta name="keywords"
    content="ologle, stranger video chat, random video call, anonymous text chat, peer-to-peer audio, webrtc stranger chat, safe random chat" />
  <meta name="author" content="OLOGLE Network" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#EC5E27" />
  <link rel="canonical" href="https://ologle.vercel.app/" />

  <!-- Orange Block SVG Favicon for Ologle -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23EC5E27'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23FFFFFF' font-family='Plus Jakarta Sans, Montserrat, Inter, sans-serif' font-weight='900' font-size='38'%3EO%3C/text%3E%3C/svg%3E" />

  <!-- Open Graph Social Share Cards -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OLOGLE" />
  <meta property="og:title" content="OLOGLE — Instant Stranger Video, Audio & Text Chat" />
  <meta property="og:description"
    content="Meet verified strangers matching your profession and interests. 100% ephemeral and private across video, audio, and text chat." />
  <meta property="og:url" content="https://ologle.vercel.app/" />

  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OLOGLE — Instant Stranger Video, Audio & Text Chat" />
  <meta name="twitter:description"
    content="Connect anonymously through real-time video, audio, and text chat. Zero persistent logs." />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "OLOGLE",
    "url": "https://ologle.vercel.app",
    "applicationCategory": "CommunicationApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "featureList": [
      "1-on-1 Real-Time Video Chat",
      "Voice-Only Audio Chat with Waveform Visualizers",
      "Instant Encrypted Text Chat",
      "Interest & Profession Matchmaking",
      "Zero Disk Storage Ephemeral Privacy"
    ]
  }
  </script>

  <!-- Non-render-blocking Fonts with display=swap (Plus Jakarta Sans, Outfit, Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800&family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
  >
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('ologle_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'white');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
